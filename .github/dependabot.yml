version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/TrashVanish"
      - "/TrashVanish.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Keep the application's and tests' SQLite packages in sync.
      sqlite:
        patterns:
          - "System.Data.SQLite.*"
      test-tooling:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
